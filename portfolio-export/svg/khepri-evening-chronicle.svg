  <defs>
    <filter id="khepri-pearl-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" />
    </filter>
    <filter id="khepri-substrate-glow" x="-15%" y="-25%" width="130%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#001EFF" flood-opacity="0.95" />
    </filter>
  </defs>
  <style>
    .khepri-cycle-group {
      color: #001EFF;
      animation: khepriChronicleCycle 8s linear infinite;
    }
    @keyframes khepriChronicleCycle {
      0%   { color: #001EFF; }
      20%  { color: #B915CC; }
      40%  { color: #FF3131; }
      60%  { color: #00FFFF; }
      80%  { color: #39FF14; }
      100% { color: #001EFF; }
    }
  </style>

