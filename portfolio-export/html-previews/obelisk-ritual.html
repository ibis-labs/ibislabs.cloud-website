<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obelisk of Istanbul Ritual — Thoth's Notebook Portfolio Piece</title>
  <link rel="stylesheet" href="previews.css" />
</head>
<body data-preview="obelisk">
  <nav class="preview-topbar">
    <a class="preview-back-link" href="../index.html">← Master Portfolio Gallery</a>
    <span class="preview-badge">Animated SVG ViewBox Camera &amp; Knock Ritual</span>
  </nav>

  <main class="preview-stage">
    <header class="preview-header">
      <h1 class="preview-title">Obelisk of Istanbul</h1>
      <p class="preview-subtitle">Smooth ViewBox Camera Pan · 3x Knock Color Shift · Pedestal &amp; Nedjem Bastet</p>
    </header>

    <section class="preview-card">
      <div id="obelisk-viewport" class="obelisk-viewport" title="Click monument to knock"></div>
      <div id="obelisk-status" class="status-readout">CAMERA: SUMMIT · KNOCK SEQUENCE: 0 / 3</div>

      <div class="preview-controls">
        <button type="button" data-obelisk-cam="summit" class="cyber-btn">Summit</button>
        <button type="button" data-obelisk-cam="landing" class="cyber-btn">Landing</button>
        <button type="button" data-obelisk-cam="anchored" class="cyber-btn">Anchored</button>
        <button type="button" data-obelisk-cam="totality" class="cyber-btn cyber-btn-active">Totality</button>
        <button type="button" data-obelisk-cam="pedestal" class="cyber-btn">Pedestal &amp; Cat</button>
        <button type="button" data-obelisk-cam="bastet" class="cyber-btn cyber-btn-gold">Nedjem Bastet</button>
        <button id="obelisk-knock-btn" type="button" class="cyber-btn cyber-btn-purple">Knock (0/3)</button>
        <button id="obelisk-reset-btn" type="button" class="cyber-btn">Reset</button>
      </div>
    </section>
  </main>

  <script src="svg-bundle.js"></script>
  <script src="previews.js"></script>

</html>
