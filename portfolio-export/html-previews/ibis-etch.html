<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thoth's Chip Splash Etch — Thoth's Notebook Portfolio Piece</title>
  <link rel="stylesheet" href="previews.css" />
</head>
<body data-preview="ibis">
  <nav class="preview-topbar">
    <a class="preview-back-link" href="../index.html">← Master Portfolio Gallery</a>
    <span class="preview-badge">Splash Login Circuit Etch</span>
  </nav>

  <main class="preview-stage">
    <header class="preview-header">
      <h1 class="preview-title">Thoth's Chip Splash Etch</h1>
      <p class="preview-subtitle">11-Stage Silicon Die → Sacred Ibis → Outer Package → 16-Pin Etch</p>
    </header>

    <section class="preview-card ibis-splash-card">
      <h2 id="ibis-splash-heading" class="ibis-splash-title">Thoth's Notebook</h2>

      <div
        id="ibis-mount"
        class="etch-svg-mount ibis-glow-cyan"
        role="button"
        tabindex="0"
        title="Click to replay Thoth's Chip etching sequence"
      ></div>

      <div id="ibis-splash-byline" class="ibis-splash-byline">
        <span class="ibis-splash-powered">Powered by</span>
        <span class="ibis-splash-lab">Ibis Labs LLC</span>
      </div>

      <div id="ibis-status" class="status-readout">
        ETCHING SILICON DIE → IBIS CREST &amp; BEAK → PACKAGE → 16 OUTER PINS
      </div>

      <div class="preview-controls">
        <button id="ibis-replay-btn" type="button" class="cyber-btn cyber-btn-active">Replay Etch</button>
        <button id="ibis-lockup-btn" type="button" class="cyber-btn cyber-btn-active">Splash Lockup: On</button>
        <button type="button" data-ibis-color="cyan" class="cyber-btn cyber-btn-active">Cyber Cyan</button>
        <button type="button" data-ibis-color="gold" class="cyber-btn cyber-btn-gold">Ankh Gold</button>
        <button type="button" data-ibis-color="purple" class="cyber-btn cyber-btn-purple">Seshat Purple</button>
      </div>
    </section>
  </main>

  <script src="svg-bundle.js"></script>
  <script src="previews.js"></script>
</body>
</html>
